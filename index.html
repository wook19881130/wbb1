<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>保护环境 · 从我做起</title>
    <style>
        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(to bottom, #e8f5e9, #ffffff);
            color: #2e7d32;
        }
        header {
            background-color: #4caf50;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        section {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            border-left: 6px solid #4caf50;
            padding-left: 10px;
        }
        ul {
            line-height: 2;
        }
        .card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 20px;
            margin: 20px 0;
        }
        footer {
            background: #4caf50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 50px;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background: #388e3c;
        }
    </style>
</head>

<body>

<header>
    <h1>🌍 保护环境 · 从我做起</h1>
    <p>爱护地球，就是爱护我们共同的家园</p >
</header>

<section>
    <div class="card">
        <h2>为什么要保护环境？</h2>
        <p>
            地球是人类唯一的家园。环境污染、气候变暖、资源枯竭，
            正在威胁我们的健康和未来。保护环境，不是一句口号，
            而是一种责任。
        </p >
    </div>

    <div class="card">
        <h2>我们可以做什么？</h2>
        <ul>
            <li>🌱 节约用水、用电，减少资源浪费</li>
            <li>🚯 不乱扔垃圾，做好垃圾分类</li>
            <li>🚲 多步行、多骑车，减少碳排放</li>
            <li>🛍️ 少用一次性塑料制品</li>
            <li>🌳 爱护花草树木，保护生态环境</li>
        </ul>
    </div>

    <div class="card">
        <h2>一起行动吧</h2>
        <p>
            每一个小小的环保行为，都会让世界变得更美好。
            让我们从今天开始，从身边的小事做起。
        </p >
        我愿意参与环保行动
    </div>
</section>

<footer>
    <p>© 2025 绿色地球 · 保护环境 人人有责</p >
</footer>

</body>
</html>
